specVersion: 0.0.5
description: Subgraph for Zypher Restaking
repository: https://github.com/zypher-game/restaking-subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ZypherRestaking
    network: linea
    source:
      abi: Restaking
      address: "0xb78e82CF9457C3Cf6b275E8387038764baDa6F73"
      startBlock: 10722237
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - Asset
        - Deposit
        - Token
        - User
        - Withdraw
      abis:
        - name: Restaking
          file: ./abis/Restaking.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,uint256)
          handler: handleWithdraw
  - kind: ethereum
    name: ChainlinkDataFeed
    network: linea
    source:
      abi: DataFeed
      address: "0x0635163285C6ef5692167F18b799FB339DF064f8"
      startBlock: 602772
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - DataFeed
      abis:
        - name: DataFeed
          file: ./abis/ChainlinkDataFeed.json
      eventHandlers:
        - event: AnswerUpdated(indexed int256,indexed uint256,uint256)
          handler: handleAnswerUpdated
